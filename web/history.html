<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史记录 · 灵光成稿</title><link rel="stylesheet" href="/style.css"><style>body{display:block}.archive{max-width:1080px;margin:48px auto;padding:0 24px}header,.filters,.links{display:flex;gap:16px;align-items:center;justify-content:space-between}.filters{margin:32px 0}input,select{padding:14px;border:1px solid #d8e2db;border-radius:12px;font:inherit}input{flex:1;min-width:0}.record{background:white;padding:24px;border:1px solid #dce5df;border-radius:16px;margin:16px 0}.record p{margin:12px 0;overflow-wrap:anywhere}.links{justify-content:flex-start;flex-wrap:wrap}small{color:#647369}@media(max-width:600px){header,.filters{flex-wrap:wrap}.archive{margin:24px auto}.record{padding:18px}}</style><body><main class="archive"><header><div><div class="eyebrow">CONTENT ARCHIVE</div><h1>历史生成记录</h1></div><a class="secondary" href="/">＋ 新建图文稿</a></header><p>过往稿件、飞书文档与配图包，都保存在这里。</p><div class="filters"><input id="search" aria-label="搜索记录" placeholder="搜索标题或BV号"><select id="status" aria-label="筛选状态"><option value="">所有状态</option><option value="complete">已完成</option><option value="failed">失败</option><option value="running">处理中</option><option value="queued">排队中</option><option value="cancelled">已取消</option></select><button id="refresh" class="secondary">刷新</button></div><p id="count" role="status"></p><div id="records"></div></main><script src="/history.js" defer></script></body></html>
