<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>灵光视频转录</title></head><body>
<header><span class="logo">光</span><div><h1>把视频，留下来。</h1><p>完整转录 · 在自己的设备处理</p></div></header>
<section><label for="url">当前B站视频</label><textarea id="url" rows="2" placeholder="打开视频页，或粘贴B站链接 / BV号"></textarea><small id="videoTitle"></small><div class="actions"><button id="transcribe" class="primary">转录完整内容</button><button id="article">生成图文</button></div><p class="hint">转录不需要写作API。生成图文使用你自己的模型。</p></section>
<p id="notice" role="status"></p>
<nav><h2>任务与历史</h2><button id="refresh">刷新</button></nav><div id="jobs"></div>
<details><summary>模型与飞书设置（可选）</summary><form id="config"><label>写作方式<select name="mode"><option value="gpt">自己的模型API</option><option value="openclacky">本机OpenClacky（需运行时）</option></select></label><label>模型API地址<input name="api_base" value="https://api.openai.com/v1"></label><label>模型名称<input name="model" placeholder="填写自己的模型名称"></label><label>API Key<input name="api_key" type="password" autocomplete="off" placeholder="只保存到本机组件"></label><label>飞书 App ID<input name="app_id"></label><label>飞书 App Secret<input name="app_secret" type="password" autocomplete="off"></label><label class="check"><input id="publish" type="checkbox">生成图文后保存到自己的飞书</label><button>保存到本机</button> <button type="button" id="testModel">测试模型连接</button><p class="hint">测试会发起一次自己的模型请求。</p></form></details>
<button id="stopWorker">停止空闲本机组件</button><footer><span>本机处理，无中央转录服务器。</span><button id="setup">安装帮助</button></footer><script type="module" src="popup.js"></script></body></html>
